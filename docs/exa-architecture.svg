<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc">
<title id="title">A user's query through Next Move and Exa Deep</title><desc id="desc">The user enters a query. The browser sends it to Next.js API routes. Three backend workflows research the person, find roles, and draft and review a resume. Every external request passes through one Exa adapter to Deep Search. The app checks returned data and sends results and real activity updates back to the browser.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#7888A3"/></marker></defs>
<rect width="1400" height="1190" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="39" font-size="18" fill="#687790" font-weight="700">NEXT MOVE · FROM QUERY TO RESULTS</text><rect x="330" y="65" width="740" height="89" rx="16" fill="#243F87" stroke="#243F87" stroke-width="2"/><text x="354" y="95" font-size="17" fill="#DDE8FF" font-weight="700">USER ENTERS A QUERY</text><text x="354" y="130" font-size="27" fill="#FFFFFF" font-weight="600">Name + profession, employer, or profile link</text><path d="M700 154 V187" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="190" width="1320" height="128" rx="16" fill="#F2F6FE" stroke="#D7E0EE" stroke-width="2"/><text x="64" y="224" font-size="21" fill="#243F87" font-weight="700">BROWSER · frontend/</text><text x="64" y="262" font-size="27" fill="#1F2D43" font-weight="600">Start → Profile → Roles → Resume</text><text x="64" y="294" font-size="21" fill="#52627A" font-weight="400">You select evidence, choose preferences, and pick a role. State stays in this page’s memory.</text><path d="M700 318 V347" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="350" width="1320" height="79" rx="16" fill="#F8FAFC" stroke="#D7E0EE" stroke-width="2"/><text x="64" y="379" font-size="17" fill="#687790" font-weight="700">SERVER ENTRY POINTS · app/api/</text><text x="64" y="411" font-size="23" fill="#25324A" font-weight="600">/api/research</text><text x="520" y="411" font-size="23" fill="#25324A" font-weight="600">/api/opportunities</text><text x="1000" y="411" font-size="23" fill="#25324A" font-weight="600">/api/tailor</text><path d="M250 429 V454" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 429 V454" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1150 429 V454" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="458" width="420" height="222" rx="16" fill="#FFFFFF" stroke="#D7E0EE" stroke-width="2"/><text x="60" y="493" font-size="24" fill="#1F2D43" font-weight="700">01 · Research the person</text><text x="60" y="532" font-size="21" fill="#25324A" font-weight="400">1. Resolve the identity</text><text x="60" y="563" font-size="21" fill="#25324A" font-weight="400">2. Research career history</text><text x="60" y="594" font-size="21" fill="#25324A" font-weight="400">3. Research each known role</text><text x="60" y="633" font-size="18" fill="#687790" font-weight="400">Ask you if identity stays unclear.</text><text x="60" y="661" font-size="19" fill="#243F87" font-weight="700">N + 2 Deep calls*</text><rect x="490" y="458" width="420" height="222" rx="16" fill="#FFFFFF" stroke="#D7E0EE" stroke-width="2"/><text x="510" y="493" font-size="24" fill="#1F2D43" font-weight="700">02 · Find roles</text><text x="510" y="532" font-size="21" fill="#25324A" font-weight="400">1. Discover possible openings</text><text x="510" y="563" font-size="21" fill="#25324A" font-weight="400">2. Check requirements and fit</text><text x="510" y="594" font-size="21" fill="#25324A" font-weight="400">3. Keep roles that pass checks</text><text x="510" y="633" font-size="18" fill="#687790" font-weight="400">Uses your selected evidence.</text><text x="510" y="661" font-size="19" fill="#243F87" font-weight="700">2 Deep calls*</text><rect x="940" y="458" width="420" height="222" rx="16" fill="#FFFFFF" stroke="#D7E0EE" stroke-width="2"/><text x="960" y="493" font-size="24" fill="#1F2D43" font-weight="700">03 · Create a resume</text><text x="960" y="532" font-size="21" fill="#25324A" font-weight="400">1. Draft for your chosen role</text><text x="960" y="563" font-size="21" fill="#25324A" font-weight="400">2. Review support and relevance</text><text x="960" y="594" font-size="21" fill="#25324A" font-weight="400">3. Build the printable document</text><text x="960" y="633" font-size="18" fill="#687790" font-weight="400">You review before exporting.</text><text x="960" y="661" font-size="19" fill="#243F87" font-weight="700">2 Deep calls*</text><path d="M250 680 V710 H700 M1150 680 V710 H700 M700 680 V710 H430 V743" stroke="#7888A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="746" width="780" height="166" rx="16" fill="#F2F6FE" stroke="#D7E0EE" stroke-width="2"/><text x="64" y="781" font-size="22" fill="#243F87" font-weight="700">OUR EXA ADAPTER · backend/providers/exa/</text><text x="64" y="817" font-size="22" fill="#25324A" font-weight="400">Check schema · add server key · enforce request limits</text><text x="64" y="851" font-size="22" fill="#25324A" font-weight="400">query + systemPrompt + outputSchema + contents</text><text x="64" y="887" font-size="22" fill="#243F87" font-weight="600">Every request explicitly sets type: "deep"</text><rect x="900" y="746" width="460" height="263" rx="16" fill="#EAF6F1" stroke="#BBDACD" stroke-width="2"/><text x="925" y="782" font-size="25" fill="#1D664E" font-weight="700">EXA DEEP · /search</text><text x="925" y="822" font-size="23" fill="#25324A" font-weight="400">Plan → search and inspect</text><text x="925" y="859" font-size="23" fill="#25324A" font-weight="400">Refine → synthesize an answer</text><text x="925" y="909" font-size="21" fill="#426C60" font-weight="400">Researches accessible public web</text><text x="925" y="945" font-size="21" fill="#426C60" font-weight="400">Returns data and source links</text><text x="925" y="981" font-size="18" fill="#426C60" font-weight="400">Internal reasoning is not streamed.</text><path d="M820 798 H897" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="831" y="781" font-size="15" fill="#687790" font-weight="700">POST</text><path d="M900 873 H823" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="832" y="854" font-size="12" fill="#687790" font-weight="700">SSE / JSON</text><path d="M430 912 V946" fill="none" stroke="#7888A3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="950" width="780" height="120" rx="16" fill="#F8FAFC" stroke="#D7E0EE" stroke-width="2"/><text x="64" y="986" font-size="21" fill="#25324A" font-weight="700">OUR APP READS AND CHECKS THE RESULT</text><text x="64" y="1023" font-size="22" fill="#25324A" font-weight="400">Final content · field citations · source pages · receipt</text><text x="64" y="1053" font-size="20" fill="#687790" font-weight="400">Then apply the checks for the current task.</text><path d="M430 1070 V1102 H1380 V254 H1363" fill="none" stroke="#7888A3" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="446" y="1090" font-size="19" fill="#52627A" font-weight="600">Results + real progress updates return to the browser</text><text x="40" y="1140" font-size="18" fill="#687790" font-weight="400">* Usual successful path: N employment entries, no extra questions or retries. Full journey: N + 6 calls.</text><text x="40" y="1171" font-size="18" fill="#687790" font-weight="400">Source links help us inspect claims. They do not, on their own, prove those claims are accurate.</text></g></svg>